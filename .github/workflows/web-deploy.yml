name: Web Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Flutter Web Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.6'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (fatura modülü)
        run: flutter analyze lib/features/fatura lib/core/services/ai_extraction_service.dart --no-fatal-infos --no-fatal-warnings

      - name: Build web release
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  deploy:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Verify Firebase secret
        run: |
          if [ -z "${{ secrets.FIREBASE_TOKEN }}" ] && [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::FIREBASE_TOKEN veya FIREBASE_SERVICE_ACCOUNT secret tanımlı değil."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        run: |
          if [ -n "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "Deploying via FIREBASE_TOKEN..."
            npx firebase-tools deploy --only hosting --project dsys-44b8e --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
          else
            echo "Deploying via service account..."
            npx firebase-tools deploy --only hosting --project dsys-44b8e --non-interactive
          fi
